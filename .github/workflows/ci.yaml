name: ci

on:
  pull_request:
    # Runs when a PR is opened or its head branch is updated, and only when
    # the diff touches shell code, tests, or this workflow.
    paths:
      - '**/*.sh'
      - 'tests/**'
      - '.github/workflows/**'

jobs:
  shell-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y bubblewrap jq

      # ubuntu-24.04 runners restrict unprivileged user namespaces via
      # AppArmor; bwrap needs them.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Hook tests
        run: bash tests/test-hooks.sh

      - name: Sandbox tests
        run: bash tests/test-sandbox.sh

      - name: Script tests
        run: |
          failed=0
          for t in tests/scripts/test-*.sh; do
            echo "### ${t}"
            bash "${t}" || failed=1
          done
          exit "${failed}"
